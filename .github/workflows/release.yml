name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow and release identity policy
        run: |
          python3 scripts/check-workflow-supply-chain.py
          python3 scripts/check-xcss.py --native
          python3 scripts/xcss-conformance.py verify-xcss
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Prove the server target gate rejects non-canonical targets
        run: |
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl
          for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            log="$RUNNER_TEMP/xcss-server-target-$target.log"
            if cargo check --locked -p xcss --target "$target" 2>"$log"; then
              echo "::error::xcss unexpectedly accepted $target"
              exit 1
            fi
            cat "$log"
            grep -F "xcss supports only x86_64-unknown-linux-gnu server builds" "$log"
          done
      - name: Verify the Rust server package
        run: |
          cargo fmt --all -- --check
          python3 scripts/check-rust-package-licenses.py
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --no-default-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=2
          RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --all-features --no-deps
      - name: Verify native release tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_release_*.py'
      - name: Build exact release tree
        run: >-
          python3 scripts/build-release-assets.py
          --output "$RUNNER_TEMP/xcss-release"
          --source-revision "$GITHUB_SHA"
          --tag "$GITHUB_REF_NAME"
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to reuse or overwrite existing release $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/xcss-release/artifacts/"* \
            "$RUNNER_TEMP/xcss-release/release-tree.json" \
            --verify-tag \
            --title "xcss ${GITHUB_REF_NAME}" \
            --notes-file "$notes"
